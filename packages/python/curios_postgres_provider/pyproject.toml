[project]
name = "curios-postgres-provider"
version = "0.0.0"
description = "PostgreSQL provider boundary for Curios bootstrap."
requires-python = ">=3.14,<3.15"
dependencies = [
  "curios-contracts",
  "curios-core",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.0",
]

[tool.uv.sources]
curios-contracts = { workspace = true }
curios-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
