[project]
name = "curios-observability"
version = "0.0.0"
description = "Curios-owned observability and correlation package boundary."
requires-python = ">=3.14,<3.15"
dependencies = [
  "curios-contracts",
  "opentelemetry-api>=1.38.0",
]

[tool.uv.sources]
curios-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
