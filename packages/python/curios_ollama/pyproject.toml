[project]
name = "curios-ollama"
version = "0.0.0"
description = "Curios Ollama provider boundary."
requires-python = ">=3.14,<3.15"
dependencies = [
  "curios-contracts",
  "curios-core",
]

[tool.uv.sources]
curios-contracts = { workspace = true }
curios-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
