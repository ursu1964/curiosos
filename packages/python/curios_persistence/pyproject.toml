[project]
name = "curios-persistence"
version = "0.0.0"
description = "PostgreSQL runtime persistence primitives for Curios M0."
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16.0",
  "curios-contracts",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.0",
]

[tool.uv.sources]
curios-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
