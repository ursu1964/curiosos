[project]
name = "curiosos"
version = "0.0.0"
description = "CuriosOS monorepo workspace root."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "pytest>=9.0.0",
  "ruff>=0.14.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = [
  "packages/python/curios_contracts",
  "packages/python/curios_core",
  "packages/python/curios_observability",
]

[tool.ruff]
line-length = 100
src = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
pythonpath = ["packages/python/curios_contracts/src", "tests/fixtures"]
testpaths = []
