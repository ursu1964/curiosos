[project]
name = "curiosos"
version = "0.0.0"
description = "CuriosOS monorepo workspace root."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.19.0",
  "pytest>=9.0.0",
  "PyYAML>=6.0.3",
  "ruff>=0.14.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = [
  "apps/api",
  "packages/python/curios_contracts",
  "packages/python/curios_core",
  "packages/python/curios_cognitive",
  "packages/python/curios_dag",
  "packages/python/curios_config",
  "packages/python/curios_ollama",
  "packages/python/curios_observability",
  "packages/python/curios_persistence",
  "packages/python/curios_policy",
  "packages/python/curios_postgres_provider",
  "packages/python/curios_runtime",
]

[tool.ruff]
line-length = 100
src = []

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
  "acceptance: BOOT acceptance tests that verify cross-component foundation behavior.",
  "integration: Cross-package integration tests; some cases use Docker-backed services.",
]
pythonpath = [
  "apps/api/src",
  "packages/python/curios_contracts/src",
  "packages/python/curios_core/src",
  "packages/python/curios_cognitive/src",
  "packages/python/curios_dag/src",
  "packages/python/curios_observability/src",
  "packages/python/curios_persistence/src",
  "packages/python/curios_policy/src",
  "packages/python/curios_runtime/src",
  "tests/fixtures",
]
testpaths = []
